[package]
name="localai-studio"
version="1.0.0"
edition="2021"

[build-dependencies]
tauri-build={version="2"}

[dependencies]
tauri={version="2",features=[]}
tauri-plugin-shell="2"
serde={version="1",features=["derive"]}
serde_json="1"
sysinfo="0.33"
which="7"

[features]
custom-protocol=["tauri/custom-protocol"]
default=["custom-protocol"]
